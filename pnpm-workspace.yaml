# pnpm build-script approvals. pnpm blocks dependency install scripts by
# default; esbuild and @parcel/watcher need theirs to provide the native
# binaries Vite and the TanStack dev server rely on. Keep this in sync with
# `pnpm approve-builds` when adding dependencies that ship build scripts,
# otherwise `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  'tesseract.js': true
overrides:
  '@vitest/mocker@>=2.1.0-beta.7 <4.1.12': ^4.1.12
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  postcss-selector-parser@<6.1.5: ^6.1.5
  seroval@>=1.5.5 <1.6.10: ^1.6.10
  seroval@>=1.6.0 <1.6.11: ^1.6.11
  undici@>=7.0.0 <7.30.1: ^7.30.1
